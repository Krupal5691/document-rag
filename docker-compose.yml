# Production-style setup: Qdrant server + API + demo UI sharing one index.
#   docker compose up -d qdrant
#   docker compose run --rm api python -m rag_core ingest      # one-time indexing
#   docker compose up -d api demo
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - index_data:/app/.index          # parent-chunk docstore
      - ./logs:/app/logs
    ports: ["8000:8000"]
    depends_on: [qdrant]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s

  demo:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes: [index_data:/app/.index]
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.headless", "true"]
    ports: ["8501:8501"]
    depends_on: [qdrant]

volumes:
  qdrant_data:
  index_data:
